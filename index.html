<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Navigation & Location Finder</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation Bar -->
    <header>
        <h1>Campus Navigator</h1>
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Search building...">
            <button id="search-btn">Search</button>
        </div>
    </header>

    <!-- Map Display Container -->
    <div id="map"></div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Custom Map And Backend Integration Script -->
    <script>
        // Removes spaces and hyphens and lowercases, so "food tech" matches "FOOD-TECH"
        function normalize(text) {
            return text.toLowerCase().replace(/[\s-]+/g, '');
        }

        // 1. Initialize the map centered on campus
        var map = L.map('map').setView([6.5244, 3.3792], 16);

        // 2. Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var buildingMarkers = [];
        var userLatLng = null; // Stores user's real-time GPS position
        var currentRoutePolyline = null; // Stores active direction line

        // 3. Fetch Buildings from PHP Backend and Display Markers with Photos
        fetch('get_buildings.php')
            .then(response => response.json())
            .then(data => {
                data.forEach(building => {
                    var lat = parseFloat(building.latitude);
                    var lng = parseFloat(building.longitude);

                    // Create popup content with building image, details, and Get Directions button
                    var popupContent = `
                        <div style="text-align: center; width: 200px;">
                            <img src="${building.image_path}" alt="${building.building_name}" style="width: 100%; height: 110px; object-fit: cover; border-radius: 4px; margin-bottom: 5px;" onerror="this.src='https://via.placeholder.com/200x110?text=No+Image'">
                            <b style="font-size: 0.95rem;">${building.building_name} (${building.acronym})</b><br>
                            <p style="margin: 4px 0; font-size: 0.85rem; color: #444;">${building.description}</p>
                            <span style="font-size: 0.75rem; color: #555; background: #eee; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px;">${building.category}</span><br>
                            <button onclick="getDirections(${lat}, ${lng}, '${building.building_name}')" style="background: #27ae60; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; width: 100%;">Get Directions</button>
                        </div>
                    `;

                    var marker = L.marker([lat, lng]).addTo(map);
                    marker.bindPopup(popupContent);

                    // Save reference for normalized searching
                    buildingMarkers.push({
                        name: normalize(building.building_name),
                        acronym: building.acronym ? normalize(building.acronym) : '',
                        marker: marker,
                        latlng: [lat, lng]
                    });
                });
            })
            .catch(error => console.error('Error loading building data:', error));

        // 4. Handle Search Bar Functionality with normalization
        document.getElementById('search-btn').addEventListener('click', function() {
            let query = normalize(document.getElementById('search-input').value);
            if (!query) return;

            let found = buildingMarkers.find(b => b.name.includes(query) || b.acronym.includes(query));
            if (found) {
                map.setView(found.latlng, 18); // Zoom in on building
                found.marker.openPopup();
            } else {
                alert('Building not found!');
            }
        });

        // Allow pressing 'Enter' key to search as well
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('search-btn').click();
            }
        });

        // 5. Integrate Browser Geolocation (User GPS Position)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                userLatLng = [position.coords.latitude, position.coords.longitude];

                var userMarker = L.marker(userLatLng, {
                    title: "Your Location"
                }).addTo(map);

                userMarker.bindPopup("<b>You are here</b>").openPopup();
            }, function(error) {
                console.log("Geolocation access denied or unavailable.");
            });
        }

        // 6. Function to Draw Route Polyline from User GPS to Destination
        function getDirections(destLat, destLng, destName) {
            if (!userLatLng) {
                alert("Unable to fetch your current GPS position. Please ensure location permissions are enabled.");
                return;
            }

            if (currentRoutePolyline) {
                map.removeLayer(currentRoutePolyline);
            }

            var routePoints = [
                userLatLng,
                [destLat, destLng]
            ];

            currentRoutePolyline = L.polyline(routePoints, {
                color: '#3498db',
                weight: 5,
                opacity: 0.8,
                dashArray: '10, 10'
            }).addTo(map);

            map.fitBounds(currentRoutePolyline.getBounds(), { padding: [50, 50] });
        }
    </script>

</body>
</html>
